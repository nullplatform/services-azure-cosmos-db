name: credential-safety

on:
  pull_request:
    branches:
      - main

jobs:
  no-log-leaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block xtrace and environment dumps in shell scripts
        run: |
          set -euo pipefail

          # Discover by shebang as well as extension, so extensionless scripts
          # (scripts/azure/*, entrypoint/*) are covered and not just *.sh.
          FILES=()
          while IFS= read -r -d '' f; do
            case "$f" in *.sh) FILES+=("$f"); continue ;; esac
            IFS= read -r first < "$f" 2>/dev/null || continue
            case "$first" in '#!'*sh*) FILES+=("$f") ;; esac
          done < <(find . -type f -not -path './.git/*' -print0)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No shell scripts found"
            exit 0
          fi

          rc=0

          # xtrace echoes every command with its expansions. These scripts run
          # tofu with provider credentials in their environment, so the trace
          # reaches the service action log. Matches -x inside any flag cluster
          # and the long form.
          if grep -nE '^[[:space:]]*set[[:space:]]+(-[a-zA-Z]*x[a-zA-Z]*|-o[[:space:]]+xtrace)([[:space:]]|$)' "${FILES[@]}"; then
            echo "::error::xtrace enabled: expanded commands would reach the action log"
            rc=1
          fi

          # A bare env/printenv dumps AZURE_*/ARM_* credentials to stdout, which
          # the agent streams into the action log.
          if grep -nE '^[[:space:]]*(env|printenv)([[:space:]]|$)' "${FILES[@]}"; then
            echo "::error::environment dump: may leak credentials to the action log"
            rc=1
          fi

          exit $rc
